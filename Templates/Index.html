<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/style.css') }}">
</head>
<body>

    <h1>CV Generator</h1>

    <form action="/generate" method="post">
        <label for="theme">Select Theme</label>
        <select id="theme" name="theme">
            <option value="professional">Professional</option>
            <option value="modern">Modern</option>
            <option value="dark">Dark</option>
        </select>

        <label>Full Name</label>
        <br>
        <input type="text" name="name" required>

        <br><br>

        <label>Email</label>
        <br>
        <input type="email" name="email" required>

        <br><br>

        <label>Phone Number</label>
        <br>
        <input type="text" name="phone">

        <br><br>

        <label>Location</label>
        <br>
        <input type="text" name="location">

        <br><br>

        <label>LinkedIn Profile</label>
        <br>
        <input type="text" name="linkedin">

        <br><br>

        <label>Git Profile</label>
        <br>
        <input type="text" name="git_profile">

        <br><br>

        <label>Education</label>
        <br>
        <textarea name="education" rows="5"></textarea>

        <br><br>

        <label>Experience</label>
        <br>
        <textarea name="experience" rows="5"></textarea>

        <br><br>

        <label>Skills</label>
        <br>
        <textarea name="skills" rows="5"></textarea>

        <br><br>

        <label>Certification</label>
        <br>
        <input type="text" name="certification">

        <br><br>

        <label for="hobbies">Hobbies and Interests</label>
        <br>
        <textarea id="hobbies" name="hobbies" rows="3"></textarea>

        <br><br>

        <button type="submit">Generate CV</button>

    </form>

</body>
</html>
